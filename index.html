<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Graphics & Math Prototypes Hub</title>
    <style>
        body { margin: 0; background: #121212; color: #e0e0e0; font-family: monospace; padding: 40px; }
        h1 { color: #fff; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: #1e1e1e; border: 1px solid #444; border-radius: 8px; padding: 20px; text-decoration: none; color: inherit; transition: 0.2s; }
        .card:hover { border-color: #00ffcc; transform: translateY(-3px); box-shadow: 0 4px 12px rgba(0,255,204,0.1); }
        .card h3 { margin-top: 0; color: #00ffcc; }
        .card p { font-size: 12px; color: #aaa; }
    </style>
</head>
<body>
    <h1>Graphics & Math Prototypes</h1>
    <p>A collection of interactive math logic, raycasting, and rendering experiments.</p>

    <div class="grid">
        <a href="bboxTest/" class="card">
            <h3>Bounding Box Simulator</h3>
            <p>Visualizes 3D AABB bounding boxes, sphere radius calculations, and Ray-AABB slab intersection entry/exit points.</p>
        </a>
        <!-- Add future prototype cards here as you build them -->
    </div>
</body>
</html>
